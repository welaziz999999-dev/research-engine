name: PRS provider qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prs-provider-qualification
  cancel-in-progress: false

env:
  QUALIFICATION_SHA: b45103d46a6ba90cc9508e99b569c9e4b488a009

jobs:
  selected-surface:
    name: selected-surface-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout exact evaluated baseline
        uses: actions/checkout@v4
        with:
          ref: b45103d46a6ba90cc9508e99b569c9e4b488a009
          fetch-depth: 1

      - name: Verify exact baseline identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected: $QUALIFICATION_SHA"
          echo "Actual:   $actual"
          test "$actual" = "$QUALIFICATION_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install selected qualification surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,report]"

      - name: Record resolved environment
        shell: bash
        run: |
          python --version
          python -m pip --version
          python -m ruff --version
          python -m pytest --version
          python -m pip freeze | sort

      - name: Ruff — record baseline lint condition
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests examples

      - name: Full test suite
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Doctor command smoke
        id: doctor
        if: matrix.python-version == '3.12'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          research-engine doctor --format json --no-write > /tmp/research-engine-doctor.json
          status=$?
          set -e
          cat /tmp/research-engine-doctor.json
          python -m json.tool /tmp/research-engine-doctor.json > /dev/null
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Bounded offline dry-run smoke
        id: dryrun
        if: matrix.python-version == '3.12'
        continue-on-error: true
        shell: bash
        run: |
          research-engine run "PRS qualification smoke" \
            --pack auto \
            --search-provider none \
            --browser-auth never \
            --dry-run \
            --output /tmp/prs-qualification-runs \
            > /tmp/research-engine-smoke.json
          cat /tmp/research-engine-smoke.json
          python -m json.tool /tmp/research-engine-smoke.json > /dev/null

      - name: Qualification evidence summary
        if: always()
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
        run: |
          echo "Exact baseline: $QUALIFICATION_SHA"
          echo "Python: $PYTHON_VERSION"
          echo "Ruff outcome (recorded limitation; non-blocking by itself): $RUFF_OUTCOME"
          echo "Full pytest outcome: $TEST_OUTCOME"
          echo "Doctor smoke outcome: $DOCTOR_OUTCOME"
          echo "Bounded offline dry-run outcome: $DRYRUN_OUTCOME"

      - name: Qualification functional verdict
        if: always()
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Functional qualification failed: full pytest outcome=$TEST_OUTCOME"
            exit 1
          fi

          if [ "$PYTHON_VERSION" = "3.12" ]; then
            if [ "$DOCTOR_OUTCOME" != "success" ]; then
              echo "Functional qualification failed: doctor smoke outcome=$DOCTOR_OUTCOME"
              exit 1
            fi
            if [ "$DRYRUN_OUTCOME" != "success" ]; then
              echo "Functional qualification failed: bounded dry-run outcome=$DRYRUN_OUTCOME"
              exit 1
            fi
          fi

          echo "Required functional qualification surface passed for Python $PYTHON_VERSION."

  core-only-smoke:
    name: core-only-smoke-py3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact evaluated baseline
        uses: actions/checkout@v4
        with:
          ref: b45103d46a6ba90cc9508e99b569c9e4b488a009
          fetch-depth: 1

      - name: Verify exact baseline identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected: $QUALIFICATION_SHA"
          echo "Actual:   $actual"
          test "$actual" = "$QUALIFICATION_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install core and development dependencies without report extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record resolved core-only environment
        shell: bash
        run: |
          python --version
          python -m pip --version
          python -m pytest --version
          python -m pip freeze | sort

      - name: Verify core-only summary and optional-report contract
        run: >-
          python -m pytest -q
          tests/test_packaging.py::test_core_metadata_keeps_report_renderer_optional
          tests/test_report_mode.py::test_summary_mode_does_not_import_reportlab
          tests/test_report_mode.py::test_full_mode_missing_report_extra_has_actionable_error
          tests/test_report_mode.py::test_cli_full_mode_missing_report_extra_is_concise
          tests/test_artifact_contract.py
